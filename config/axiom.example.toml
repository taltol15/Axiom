[management]
interface = "ens160"
bind_ip = "10.10.0.10"
port = 8443

[management.admin]
username = "admin"
password_hash = "sha256$6f3d970db1b6ea7a6a5fbeb048df1984$8d6a71d1567d30c18ccde438bdec831dcb7565e748a694ba1b485125807cfb32"

[policy.smb]
encrypted_payload = "monitor"

[policy.archive]
rar = "block"
seven_zip = "block"
zip = "monitor"
encrypted_zip = "block"

[policy.entropy]
mode = "monitor"
threshold = 7.9
minimum_chunk_size = 8192

[[policy.signatures]]
name = "Axiom synthetic test marker"
pattern = "AXIOM_TEST_THREAT"
mode = "block"

[[policy.signatures]]
name = "WannaCry marker WNCRY"
pattern = "WNCRY"
mode = "block"

[[policy.signatures]]
name = "WannaCry marker WANACRY"
pattern = "WANACRY!"
mode = "block"

