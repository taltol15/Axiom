[node]
role = "standalone_lab"
node_id = "axiom-lab-01"
display_name = "Axiom Standalone Lab"
enrollment_token = "replace-with-random-token-for-lab-child-nodes"
allow_invalid_management_tls = false
heartbeat_interval_seconds = 5

[node.cluster]
enabled = false

[node.control]
enabled = false

[management]
interface = "ens160"
bind_ip = "10.10.0.10"
port = 8443

[management.admin]
username = "admin"
password_hash = "sha256$6f3d970db1b6ea7a6a5fbeb048df1984$8d6a71d1567d30c18ccde438bdec831dcb7565e748a694ba1b485125807cfb32"

[management.tls]
enabled = false

[management.directory]
enabled = false
client_reverse_dns = false

[license]
enabled = true
license_path = "/etc/axiom/license.json"
state_path = "/var/lib/axiom/license-state.json"
trial_days = 30
warn_before_expiry_days = 14
# Empty uses the bundled Axiom public verification key. Override with
# AXIOM_LICENSE_PUBLIC_KEY_HEX only when rotating signing keys.
public_key_hex = ""

[dns]
enabled = true
interface = "ens256"
listen_ip = "10.10.53.10"
udp_port = 53
tcp_port = 53
upstream_interface = "ens256"
upstreams = ["10.10.0.5:53", "10.10.0.6:53"]
cache_ttl_seconds = 300
cache_max_entries = 100000
query_timeout_millis = 1500
threat_feed_refresh_seconds = 3600

[dns.policy]
blocked_domain_action = "block"
monitored_domain_action = "monitor"
blocked_domains = ["malware.test"]
monitored_domains = ["suspicious.test"]
threat_feed_urls = []
block_response = "sinkhole"
sinkhole_ipv4 = "0.0.0.0"
local_records = [
  { name = "intranet.local", type = "a", value = "10.10.0.50", ttl_seconds = 300 },
]

[dns.policy.block_page]
enabled = true
organization_name = "Axiom Security"
title = "Access to this site has been blocked"
message = "This domain was blocked by your organization's DNS security policy."
primary_color = "#34f5c5"
support_text = "Contact your IT or security team if you believe this is an error."
support_url = ""
logo_data_url = ""

[policy.smb]
encrypted_payload = "monitor"

[policy.archive]
rar = "block"
seven_zip = "block"
zip = "block"
encrypted_zip = "block"

[policy.entropy]
mode = "monitor"
threshold = 7.9
minimum_chunk_size = 8192

[policy.reputation]
enabled = true
known_bad_action = "alert"
cache_ttl_seconds = 3600

[[policy.signatures]]
name = "Axiom synthetic test marker"
pattern = "AXIOM_TEST_THREAT"
mode = "block"

[[policy.signatures]]
name = "EICAR antivirus test string"
pattern = "X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*"
mode = "block"

[[policy.signatures]]
name = "WannaCry marker WNCRY"
pattern = "WNCRY"
mode = "block"

[[policy.signatures]]
name = "WannaCry marker WANACRY"
pattern = "WANACRY!"
mode = "block"

[[proxy_listeners]]
name = "dev-file-server-vlan50"
source_interface = "ens192.50"
client_vlan = 50
listen_ip = "0.0.0.0"
listen_port = 445
target_file_server_ip = "10.50.0.20"
target_file_server_port = 445
backlog = 4096

[[proxy_listeners]]
name = "finance-file-server-vlan60"
source_interface = "ens224.60"
client_vlan = 60
listen_ip = "0.0.0.0"
listen_port = 445
target_file_server_ip = "10.60.0.15"
target_file_server_port = 445
backlog = 4096
