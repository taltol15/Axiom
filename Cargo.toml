[workspace]
members = [
    "crates/axiom-config",
    "crates/axiom-control",
    "crates/axiom-core",
    "crates/axiom-daemon",
    "crates/axiom-dns",
    "crates/axiom-license",
    "crates/axiom-net",
    "crates/axiom-reputation",
    "crates/axiom-web",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/talyosef/Axiom"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8.9"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
getrandom = "0.3"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
libc = "0.2"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6.3", features = ["all"] }
thiserror = "2"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "io-util", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
